# Netlify configuration — veg-nourish.com
#
# Veg-Nourish is a static site: no bundler, no framework, no server. The "build" step
# only regenerates the food graph and validates the data, so a broken recipe or
# a bad nutrition figure fails the deploy instead of going live.

[build]
  publish = "."
  command = "npm run build:graph && npm run build:share && npm run verify"

[build.environment]
  NODE_VERSION = "22"
  # No runtime dependencies; skip the audit noise on a zero-dependency install.
  NPM_FLAGS = "--no-audit --no-fund"

# Deploy previews and branch builds get the same checks as production.
[context.deploy-preview]
  command = "npm run build:graph && npm run build:share && npm run verify"

[context.branch-deploy]
  command = "npm run build:graph && npm run build:share && npm run verify"

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # The app loads nothing from any other origin — no CDN, no fonts, no
    # analytics — so the policy can be strict enough to be meaningful.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Nothing here needs a sensor, a camera, or your location.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The service worker must never be served stale, or a release can strand
# people on an old cache indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Recipe and nutrition data changes with releases; the service worker keeps
# its own copy, so the network copy only needs to be revalidated.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The per-recipe preview images. Link previews are cached hard by iMessage,
# Slack and friends, so these are treated as immutable and a changed card gets
# a changed filename via its slug.
[[headers]]
  for = "/icons/cards/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

# The food icons. Artwork gets revised in a way app icons do not, and a year of
# immutable would mean a redrawn icon never reaches anyone who already visited.
# The service worker holds the offline copy and refreshes it on a version bump,
# so the network copy only needs to revalidate.
[[headers]]
  for = "/icons/food/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/svg+xml; charset=utf-8"

# Shared recipe pages: revalidate, so an edited recipe updates the card and the
# preview text the next time a crawler looks.
[[headers]]
  for = "/r/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# A missing data file should look missing, not return an HTML page that then
# fails to parse as JSON somewhere confusing. Real files still win over this,
# since rewrites only fire when nothing on disk matches.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# Routing is hash-based (#/roll, #/recipe/...), so every real path maps to a
# real file. This catch-all only fires when nothing on disk matches — a
# mistyped URL opens the app instead of a dead end.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
