<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veg-Nourish — a heart-forward family meal planner</title>
  <meta name="description" content="Roll dinner ideas, size the portions to your household, tick off what is already in the pantry, and walk out with a shopping list in aisle order. Vegetarian base, omnivore fork in the road, works offline.">
  <link rel="canonical" href="https://veg-nourish.com/">

  <meta name="theme-color" content="#1f6f4a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a15" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Veg-Nourish — ERRERLabs">
  <meta property="og:title" content="Veg-Nourish — Plan meals. Shop smarter. Delicious. Healthy.">
  <meta property="og:description" content="A beautiful way to organize your pantry, simplify your grocery list, and plan nourishing meals.">
  <meta property="og:url" content="https://veg-nourish.com/">
  <meta property="og:image" content="https://veg-nourish.com/icons/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Veg-Nourish — Plan meals, shop smarter, delicious and healthy.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Veg-Nourish — Plan meals. Shop smarter. Delicious. Healthy.">
  <meta name="twitter:description" content="A beautiful way to organize your pantry, simplify your grocery list, and plan nourishing meals.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veg-Nourish">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <a class="appbar__brand" href="#/roll">
      <span class="appbar__mark" aria-hidden="true">🌿</span>
      <span>Veg-Nourish<span class="appbar__by"> · ERRERLabs</span></span>
    </a>
    <button id="install-btn" class="btn btn--ghost btn--small" type="button" hidden>Install</button>
  </header>

  <div id="install-banner" class="install-banner" hidden>
    <span id="install-text" class="install-banner__text">Add Veg-Nourish to your Home Screen: tap Share, then “Add to Home Screen”.</span>
    <button id="install-accept" class="btn btn--small btn--primary" type="button">Show me</button>
    <button id="install-dismiss" class="icon-btn" type="button" aria-label="Dismiss this, and do not ask again">✕</button>
  </div>

  <main id="main" class="main">
    <div id="splash" class="splash">
      <div class="splash__mark">🌿</div>
      <p>Loading the kitchen…</p>
      <noscript>
        <p><strong>This app needs JavaScript.</strong> Everything runs locally in your browser — there is no server to fall back on.</p>
      </noscript>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
