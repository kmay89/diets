    <g class="optical-alignment" transform="translate(32 32) scale(1.22667) translate(-32.625 -36.75)"><path d="M15 36Q20 20 37 19Q52 22 50 38Q48 53 32 54Q17 53 15 36Z" fill="url(#beef-sirloin-red)" data-tone="red"/><ellipse cx="34" cy="35" rx="8" ry="10" fill="url(#beef-sirloin-cream)" data-tone="cream" /><ellipse cx="34" cy="35" rx="4" ry="6" fill="url(#beef-sirloin-clay2)" data-tone="clay2" /></g>
