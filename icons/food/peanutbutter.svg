<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="peanutbutter-title" data-aisle="Condiments &amp; Sauces" data-render-style="dimensional">
