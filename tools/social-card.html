<!doctype html>
<!--
  social-card.html — the 1200x630 link-preview card.

  Rendered to icons/social-card.png by tools/make-social-card.mjs. The food
  photography and editable vector typography stay separate here so the final
  card can be regenerated without baking marketing copy into the image.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f5e8cf;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: block;
    width: 1200px;
    height: 630px;
  }
</style>
</head>
<body>
  <img class="layer" src="./social-card-background.png" alt="">
  <img class="layer" src="./social-card-overlay.svg" alt="">
</body>
</html>
