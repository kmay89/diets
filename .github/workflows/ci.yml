name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Tests and data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test "test/*.test.mjs"

      - name: Verify data integrity
        run: node tools/verify-data.mjs

      - name: Rebuild the graph and check it is committed
        run: |
          node tools/build-graph.mjs
          if ! git diff --quiet -- data/graph.json; then
            echo "::error::data/graph.json is stale. Run 'npm run build:graph' and commit the result."
            git diff --stat -- data/graph.json
            exit 1
          fi

      - name: Rebuild the share pages and check they are committed
        run: |
          node tools/build-share-pages.mjs
          if ! git diff --quiet -- r sitemap.xml; then
            echo "::error::Share pages or the sitemap are stale. Run 'npm run build:share' and commit the result."
            git diff --stat -- r sitemap.xml
            exit 1
          fi

      - name: Every recipe has a preview card
        run: |
          missing=0
          for id in $(node -e "
            const fs=require('fs');
            const r=[...JSON.parse(fs.readFileSync('data/recipes.dinners.json')).recipes,
                     ...JSON.parse(fs.readFileSync('data/recipes.daily.json')).recipes];
            console.log(r.map(x=>x.id.replace(/^rec\./,'')).join(' '));
          "); do
            if [ ! -f "icons/cards/$id.jpg" ]; then
              echo "::error::no preview card for $id — run 'npm run build:cards'"; missing=1
            fi
          done
          exit $missing

      - name: Check every precached file exists
        run: |
          missing=0
          for f in $(grep -oE "'\./[^']+'" sw.js | tr -d "'" | sed 's|^\./||'); do
            [ "$f" = "" ] && continue
            if [ ! -e "$f" ]; then echo "::error::sw.js precaches missing file: $f"; missing=1; fi
          done
          exit $missing

      - name: Check the deployed pages stay CSP-clean
        run: |
          # The production Content-Security-Policy has no 'unsafe-inline'. An
          # inline handler or a <style> block would break the live site while
          # working perfectly on a local server, so catch it here instead.
          # A <script type="application/ld+json"> block is data, not code: it is
          # never executed, so script-src does not apply to it. Everything else
          # inline is a real violation.
          bad=0
          for f in index.html 404.html r/lentil-bolognese/index.html; do
            if grep -nE '<(script|style)(>|[^>]*>[^<])' "$f" | grep -v 'src=' | grep -v 'application/ld+json'; then
              echo "::error::$f has an inline <script> or <style> block; the CSP forbids it"; bad=1
            fi
            if grep -nE '\son[a-z]+="' "$f"; then
              echo "::error::$f has an inline event handler; wire it up in JS instead"; bad=1
            fi
          done
          exit $bad

      - name: Check the files Netlify serves are present
        run: |
          missing=0
          for f in netlify.toml 404.html robots.txt sitemap.xml manifest.webmanifest icons/social-card.png; do
            if [ ! -e "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing
